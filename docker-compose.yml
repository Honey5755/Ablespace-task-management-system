# Local PostgreSQL for development. Matches the DATABASE_URL in
# apps/api/.env.example, so `docker compose up -d` then `npm run setup` works
# with no further configuration.
#
# Already have Postgres installed locally? Skip this and point DATABASE_URL at
# your own instance instead.

services:
  postgres:
    image: postgres:17-alpine
    container_name: pyramid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pyramid
    ports:
      - '5432:5432'
    volumes:
      - pyramid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pyramid']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pyramid-pgdata:
